# Builds a device IPA for external signing; release.yml supplies its version and draft tag.
name: ios-build

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      build_number:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: write # attach the IPA when called by the release workflow

concurrency:
  group: ios-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number || format('{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Check toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve dependencies and test
        run: |
          flutter pub get
          flutter test --no-pub

      - name: Resolve app version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_VERSION:-$(sed -n 's/^version: *\([^ +#]*\).*/\1/p' pubspec.yaml)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build unsigned device app
        env:
          BUILD_NAME: ${{ steps.version.outputs.version }}
        run: |
          flutter build ios --release --no-pub --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Package unsigned IPA
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH=build/ios/iphoneos/Runner.app
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Runner"
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload" dist
          ditto "$APP_PATH" "$RUNNER_TEMP/unsigned-ipa/Payload/Runner.app"
          IPA_PATH="$GITHUB_WORKSPACE/dist/hanamimi-plus-${VERSION}-unsigned.ipa"
          (
            cd "$RUNNER_TEMP/unsigned-ipa"
            zip -qry "$IPA_PATH" Payload
          )
          unzip -t "$IPA_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: hanamimi-plus-${{ steps.version.outputs.version }}-ios-unsigned-${{ github.run_number }}
          path: dist/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to draft release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*-unsigned.ipa --clobber
